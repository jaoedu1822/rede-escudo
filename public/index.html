<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rede Escudo | Apoio anônimo</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <!-- Moldes do escudo: copiados para o cabeçalho, para cada resposta e para o formulário -->
  <template id="t-escudo">
    <svg class="escudo" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path class="contorno" pathLength="100" d="M12 2.5 4.5 5.4v5.8c0 4.6 3.1 8.1 7.5 10.3 4.4-2.2 7.5-5.7 7.5-10.3V5.4L12 2.5Z"/>
      <path class="marca" d="m8.6 12.2 2.4 2.4 4.4-4.8"/>
    </svg>
  </template>
  <template id="t-escudo-progresso">
    <svg class="escudo-progresso" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path class="trilho" d="M12 2.5 4.5 5.4v5.8c0 4.6 3.1 8.1 7.5 10.3 4.4-2.2 7.5-5.7 7.5-10.3V5.4L12 2.5Z"/>
      <path class="avanco" pathLength="100" d="M12 2.5 4.5 5.4v5.8c0 4.6 3.1 8.1 7.5 10.3 4.4-2.2 7.5-5.7 7.5-10.3V5.4L12 2.5Z"/>
      <path class="marca" d="m8.6 12.2 2.4 2.4 4.4-4.8"/>
    </svg>
  </template>

  <div class="app">
    <header class="topo">
      <div class="marca-site">
        <span id="logo" class="logo"></span>
        <div>
          <h1>Rede Escudo</h1>
          <p>Apoio anônimo. Você conversa com uma IA, não com uma pessoa.</p>
        </div>
      </div>
      <div class="acoes-topo">
        <button id="denunciar" class="destaque" type="button">
          <span class="so-grande">Fazer denúncia</span><span class="so-pequeno">Denunciar</span>
        </button>
        <button id="limpar" class="fantasma" type="button">
          <span class="so-grande">Limpar conversa</span><span class="so-pequeno">Limpar</span>
        </button>
      </div>
    </header>

    <p class="emergencia">
      <span>Em perigo agora?</span>
      <a href="tel:190"><b>190</b> Polícia</a>
      <a href="tel:188"><b>188</b> Apoio<span class="so-grande"> emocional</span></a>
      <a href="tel:100"><b>100</b> Direitos<span class="so-grande"> humanos</span></a>
    </p>

    <main id="chat" class="chat" role="log" aria-live="polite" aria-label="Conversa"></main>

    <footer class="rodape">
      <p id="erro" class="erro" role="alert" hidden></p>
      <div id="anexo" class="anexo" hidden></div>
      <form id="form" class="compositor" autocomplete="off">
        <input id="arquivo" type="file" accept="image/png,image/jpeg,image/webp,.txt,text/plain" hidden>
        <button id="clipe" class="icone" type="button" aria-label="Anexar um print ou arquivo .txt" title="Anexar um print ou arquivo .txt">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="m20 11-8.6 8.6a5 5 0 0 1-7.1-7.1l8.9-8.9a3.4 3.4 0 0 1 4.8 4.8l-8.9 8.9a1.8 1.8 0 0 1-2.5-2.5l8.2-8.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <textarea id="msg" rows="1" maxlength="2000" placeholder="Escreva aqui" aria-label="Sua mensagem"></textarea>
        <!-- Este botão muda: enviar > parar a resposta (enquanto a IA pensa) > mostrar tudo (enquanto digita) -->
        <button id="enviar" class="enviar" type="submit" data-modo="enviar" aria-label="Enviar mensagem" title="Enviar mensagem">
          <svg class="i-enviar" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M12 19V5m0 0-6 6m6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="i-parar" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>
          <svg class="i-pular" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="m6 6 6 6-6 6m6-12 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <p class="aviso">
        Não envie fotos íntimas. Prints são lidos aqui mesmo, sem ir para serviços externos, e o arquivo não é guardado.
        <a href="status.html">Acompanhar uma denúncia</a>
      </p>
    </footer>
  </div>

  <!-- Janela de "tem certeza?" (usada ao limpar a conversa e ao descartar uma denúncia) -->
  <dialog id="confirmar" class="dialogo" aria-labelledby="conf-titulo">
    <form method="dialog">
      <h2 id="conf-titulo"></h2>
      <p id="conf-texto"></p>
      <div class="conf-botoes">
        <button id="conf-voltar" class="fantasma" value="nao" autofocus></button>
        <button id="conf-ok" class="perigo" value="sim"></button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
